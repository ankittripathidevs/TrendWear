services:

  # ===== React Frontend =====
  react_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: reactnode-app
    container_name: reactnode_container
    ports:
      - "5173:5173"
    networks:
      - react-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped


  # ===== Nginx Reverse Proxy =====
  nginx:
    build:
      context: ./nginx
    image: reactnode-nginx
    container_name: nginx_container
    ports:
      - "80:80"
    depends_on:
      react_app:
        condition: service_healthy
    networks:
      - react-network
    restart: unless-stopped


# ===== Docker Network =====
networks:
  react-network: